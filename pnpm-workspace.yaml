packages:
  - infra/*
  - packages/*
  - tools/*

catalogMode: prefer

# Agent skills that dependencies ship (pnpm approve) are linked here, where pi discovers them.
skills:
  dirs:
    - .agents/skills

catalog:
  "@cloudflare/workers-types": 5.20261015.1
  "@alchemy.run/cloudflare": 2.0.0-beta.87
  "@alchemy.run/test": 2.0.0-beta.87
  "@effect/ai-typesafe": 4.1.4
  "@effect/platform-node": 4.1.4
  "@effect/vitest": 4.1.4
  "@types/node": ^24.19.2
  alchemy: 2.0.0-beta.87
  effect: 4.1.4
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  traits: file:vendor/traits-0.5.16-pr112.tgz
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  core-js-pure: false
  esbuild: true
  sharp: true
  workerd: true
permissions:
  traits:
    skills: true
  traits@file:vendor/traits-0.5.16-pr112.tgz:
    skills: true
