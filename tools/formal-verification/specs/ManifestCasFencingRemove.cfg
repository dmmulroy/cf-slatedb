\* ManifestCasFencing with a removal (D91): a writer and a compactor whose commits may be in flight
\* while DatabaseLifecycle.remove marks the database and deletes its manifests. Without GC: with
\* it the state space exceeds the time limit (6.97M states at 150 s, unfinished).
CONSTANTS
  Writers = {w1}
  Compactors = {c1}
  JobsPerCompactor = 1
  MaxId = 8
  MaxFlushes = 2
  WithGc = FALSE
  WithRemove = TRUE
  Broken = "none"
SPECIFICATION Spec
INVARIANTS
  NoResurrection
  TypeOK
  CreateOnce
  CommitOnce
  NoStaleCommit
  FencedWriterOrphansUnreferenced
  NoDoubleReference
  LoadFindsHead
CHECK_DEADLOCK FALSE
