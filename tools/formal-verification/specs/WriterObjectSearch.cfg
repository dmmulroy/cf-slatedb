CONSTANTS
  Req = {r1, r2}
  Keys = {k1, k2}
  Ops = {"write", "txn", "flush", "seal", "probe"}
  MaxOps = 3
  MaxSeq = 3
  MaxEvictions = 1
  MaxInterrupts = 1
  MaxFailures = 1
  MaxSeals = 1
  Broken = "none"
  defaultInitValue = defaultInitValue
SPECIFICATION FullSpec
SYMMETRY Symmetry
INVARIANTS
  NeverSelfFenced
  NoAckedWriteLost
  LatestSeesAcked
  Serializable
  NoAckAfterSeal
  SealNotHalf
  CountersCover
  AlarmCovers
CHECK_DEADLOCK FALSE
