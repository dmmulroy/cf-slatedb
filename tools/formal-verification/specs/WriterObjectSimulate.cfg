CONSTANTS
  Req = {r1, r2}
  Keys = {k1, k2}
  Ops = {"write", "txn", "flush", "seal", "probe"}
  MaxOps = 6
  MaxSeq = 4
  MaxEvictions = 2
  MaxInterrupts = 2
  MaxFailures = 2
  MaxSeals = 1
  Broken = "none"
  defaultInitValue = defaultInitValue
SPECIFICATION FullSpec
INVARIANTS
  NeverSelfFenced
  NoAckedWriteLost
  LatestSeesAcked
  Serializable
  NoAckAfterSeal
  SealNotHalf
  CountersCover
  AlarmCovers
CHECK_DEADLOCK FALSE
