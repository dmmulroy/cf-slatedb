\* GcSafety with one fork of the database (WithFork, D77): a fork releases its hold only once no
\* manifest a reader of the fork may hold names the database's SSTs. One SST and up to 6
\* manifests (the shortest early-release path needs flush, hold, drop, release, and GC's commit);
\* the fork's hold is the only checkpoint here.
CONSTANTS
  Ssts = {s1}
  MaxTime = 3
  MinAge = 1
  MaxManifests = 6
  Broken = "none"
  Collectors = {g1}
  WithFork = TRUE
SPECIFICATION Spec
INVARIANTS
  TypeOK
  ReadableManifestsComplete
  PinnedManifestsComplete
  ForkReadsComplete
CHECK_DEADLOCK FALSE
